<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BESO</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <!-- ✅ Topbar -->
      <div class="topbar text-center text-white py-2">
        <div class="container">
          <p class="mb-0">
            Miễn phí vận chuyển trong nước với đơn hàng trên 1.000.000đ
          </p>
        </div>
      </div>

      <!-- ✅ Header middle -->
      <div class="header-upper-middle py-3">
        <div class="container">
          <div class="row align-items-center justify-content-between">
            <div class="col-4 text-start">
              <!-- left placeholder -->
            </div>

            <div class="col-4 text-center">
              <img src="./logo.png" alt="BESO Logo" height="60" />
            </div>

            <div
              class="col-4 d-flex justify-content-end align-items-center gap-3"
            >
              <i class="bi bi-search"></i>
              <i class="bi bi-person-circle"></i>
              <i class="bi bi-bag"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- ✅ Navbar -->
      <div class="header-menu-desktop py-2">
        <div class="container">
          <nav class="d-flex justify-content-center gap-4">
            <a href="#" class="text-decoration-none text-black">Trang chủ</a>
            <a href="#" class="text-decoration-none text-black"
              >Danh mục sản phẩm</a
            >
            <a href="#" class="text-decoration-none text-black">Giới thiệu</a>
          </nav>
        </div>
      </div>
    </header>
    <main>
      <div>
        <img src="./slideshow_1.jpg" alt="" class="img-fluid mx-auto d-block" />
      </div>
      <section class="section section-collection">
        <div class="container-fluid">
          <div class="text-center padding-title">
            <h2>
              <a href="" class="text-decoration-none text-black"
                >SỔ TAY LÊN KẾ HOẠCH 2026 (MỞ BÁN 10.10)</a
              >
            </h2>
          </div>
          <div class="container">
            <div id="product-list"></div>
          </div>
        </div>
      </section>
    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./scroll-script.js"></script>
    <script src="./render_card.js"></script>
  </body>
</html>
